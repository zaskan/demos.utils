---
# Idempotent: load existing rows from GET; POST only hostnames not already in the map.
- name: GET existing inventory
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/inventory"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    return_content: true
    status_code: [200]
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
  register: _itsm_list_inv
  when: itsm_ansible_role_inventory | bool and itsm_inventory | length > 0

- name: Merge existing inventory into hostname-to-id map
  ansible.builtin.set_fact:
    itsm_inventory_by_hostname: "{{ itsm_inventory_by_hostname | combine({ item.hostname: item.id }) }}"
  loop: "{{ _itsm_list_inv.json | default([]) }}"
  when:
    - itsm_ansible_role_inventory | bool
    - itsm_inventory | length > 0
    - _itsm_list_inv is defined

- name: POST inventory items (only new hostnames)
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/inventory"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body:
      asset_type_id: "{{ itsm_asset_type_by_name[item.asset_type_name] }}"
      hostname: "{{ item.hostname }}"
      ip_address: "{{ item.ip_address | default('') }}"
      group_name: "{{ item.group_name | default('') }}"
    status_code: [201]
    return_content: true
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ itsm_inventory }}"
  register: _itsm_inv_post
  when:
    - itsm_ansible_role_inventory | bool
    - itsm_inventory | length > 0
    - item.hostname not in (itsm_inventory_by_hostname | default({}))

- name: Merge newly created inventory rows into hostname map
  ansible.builtin.set_fact:
    itsm_inventory_by_hostname: "{{ itsm_inventory_by_hostname | combine({ item.json.hostname: item.json.id }) }}"
  loop: "{{ _itsm_inv_post.results | default([]) }}"
  when:
    - itsm_ansible_role_inventory | bool
    - _itsm_inv_post is defined
    - _itsm_inv_post.results is defined
    - item.json is defined
    - item.json.hostname is defined
    - item.json.id is defined
