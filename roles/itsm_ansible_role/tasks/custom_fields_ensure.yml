---
# Included with vars: cf_fields_url (GET/POST base), cf_fields (list of field defs)
- name: GET existing custom field definitions
  ansible.builtin.uri:
    url: "{{ cf_fields_url }}"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    return_content: true
    status_code: [200]
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
  register: _itsm_cf_list

- name: Record existing custom field keys
  ansible.builtin.set_fact:
    _itsm_cf_existing_keys: "{{ (_itsm_cf_list.json | default([])) | map(attribute='field_key') | list }}"

- name: POST custom field definitions (skip existing keys)
  ansible.builtin.uri:
    url: "{{ cf_fields_url }}"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body: "{{ lookup('template', 'custom_field_body.json.j2') | from_json }}"
    status_code: [201]
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ cf_fields }}"
  loop_control:
    loop_var: cf_item
  when: cf_item.field_key not in (_itsm_cf_existing_keys | default([]))
