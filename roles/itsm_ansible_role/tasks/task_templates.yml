---
# Idempotent: GET existing templates; POST only names not already present.
- name: GET existing task templates
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/task-templates"
    method: GET
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    return_content: true
    status_code: [200]
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
  register: _itsm_list_tt
  when: itsm_ansible_role_task_templates | bool and itsm_task_templates | length > 0

- name: Merge existing task templates into name-to-id map
  ansible.builtin.set_fact:
    itsm_task_template_by_name: "{{ itsm_task_template_by_name | combine({ item.name: item.id }) }}"
  loop: "{{ _itsm_list_tt.json | default([]) }}"
  when:
    - itsm_ansible_role_task_templates | bool
    - itsm_task_templates | length > 0
    - _itsm_list_tt is defined

- name: POST task templates (only new names)
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/task-templates"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body: "{{ lookup('template', 'task_template_body.json.j2') | from_json }}"
    status_code: [201]
    return_content: true
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ itsm_task_templates }}"
  loop_control:
    loop_var: tt_item
  register: _itsm_tt_post
  when:
    - itsm_ansible_role_task_templates | bool
    - itsm_task_templates | length > 0
    - tt_item.name not in (itsm_task_template_by_name | default({}))

- name: Merge newly created task templates into name map
  ansible.builtin.set_fact:
    itsm_task_template_by_name: "{{ itsm_task_template_by_name | combine({ item.json.name: item.json.id }) }}"
  loop: "{{ _itsm_tt_post.results | default([]) }}"
  when:
    - itsm_ansible_role_task_templates | bool
    - _itsm_tt_post is defined
    - _itsm_tt_post.results is defined
    - item.json is defined
    - item.json.name is defined
    - item.json.id is defined

- name: Ensure custom fields on task templates
  ansible.builtin.include_tasks: custom_fields_ensure.yml
  vars:
    cf_fields_url: "{{ itsm_api_base_url }}/api/v1/task-templates/{{ itsm_task_template_by_name[tt_item.name] }}/fields"
    cf_fields: "{{ tt_item.fields }}"
  loop: "{{ itsm_task_templates }}"
  loop_control:
    loop_var: tt_item
  when:
    - itsm_ansible_role_task_templates | bool
    - tt_item.fields is defined
    - tt_item.fields | length > 0
    - tt_item.name in (itsm_task_template_by_name | default({}))
