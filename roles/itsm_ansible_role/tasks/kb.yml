---
- name: POST KB articles
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/kb/articles"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body:
      title: "{{ item.title }}"
      description: "{{ item.description | default('') }}"
    status_code: [201]
    return_content: true
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ itsm_kb_articles }}"
  register: _itsm_kb_post
  when: itsm_ansible_role_kb | bool and itsm_kb_articles | length > 0

- name: Build KB title to id map
  ansible.builtin.set_fact:
    itsm_kb_by_title: "{{ itsm_kb_by_title | combine({ item.json.title: item.json.id }) }}"
  loop: "{{ _itsm_kb_post.results }}"
  when:
    - itsm_ansible_role_kb | bool
    - _itsm_kb_post is defined
    - _itsm_kb_post.results is defined
