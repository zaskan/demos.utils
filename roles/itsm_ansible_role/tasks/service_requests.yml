---
- name: POST service requests
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/requests"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body: "{{ lookup('template', 'service_request_body.json.j2') | from_json }}"
    status_code: [201]
    return_content: true
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ itsm_service_requests }}"
  loop_control:
    loop_var: sr_item
  register: _itsm_sr_post
  when: itsm_ansible_role_service_requests | bool and itsm_service_requests | length > 0

- name: Map request_key to public_id
  ansible.builtin.set_fact:
    itsm_request_by_key: "{{ itsm_request_by_key | combine({ item.sr_item.request_key: item.json.public_id }) }}"
  loop: "{{ _itsm_sr_post.results | default([]) }}"
  when:
    - itsm_ansible_role_service_requests | bool
    - _itsm_sr_post is defined
    - _itsm_sr_post.results is defined
    - item.sr_item is defined
    - item.sr_item.request_key is defined
    - item.json is defined
    - item.json.public_id is defined

- name: Submit service requests when requested
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/requests/{{ itsm_request_by_key[item.request_key] }}/submit"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body: {}
    status_code: [200]
    return_content: true
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ itsm_service_requests }}"
  loop_control:
    loop_var: item
  register: _itsm_sr_submit
  when:
    - itsm_ansible_role_service_requests | bool
    - item.submit | default(false) | bool
    - item.request_key in (itsm_request_by_key | default({}))

- name: Record change refs created by request submit
  ansible.builtin.set_fact:
    itsm_changes_from_request: "{{ itsm_changes_from_request | combine({ item.item.request_key: (item.json.changes_created | default([]) | map(attribute='public_id') | list) }) }}"
  loop: "{{ _itsm_sr_submit.results | default([]) }}"
  when:
    - itsm_ansible_role_service_requests | bool
    - _itsm_sr_submit is defined
    - _itsm_sr_submit.results is defined
    - item.item is defined
    - item.item.request_key is defined
    - item.json is defined
    - not (item.skipped | default(false))
