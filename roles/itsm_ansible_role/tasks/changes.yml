---
- name: POST standalone changes from templates
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/changes"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body: "{{ lookup('template', 'change_body.json.j2') | from_json }}"
    status_code: [201]
    return_content: true
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ itsm_changes }}"
  loop_control:
    loop_var: ch_item
  register: _itsm_chg_post
  when:
    - itsm_ansible_role_changes | bool
    - itsm_changes | length > 0
    - ch_item.change_template_name is defined
    - ch_item.change_template_name in (itsm_change_template_by_name | default({}))

- name: Map change_key to public_id
  ansible.builtin.set_fact:
    itsm_change_by_key: "{{ itsm_change_by_key | combine({ item.ch_item.change_key: item.json.public_id }) }}"
  loop: "{{ _itsm_chg_post.results | default([]) }}"
  when:
    - itsm_ansible_role_changes | bool
    - _itsm_chg_post is defined
    - _itsm_chg_post.results is defined
    - item.ch_item is defined
    - item.ch_item.change_key is defined
    - item.json is defined
    - item.json.public_id is defined

- name: Approve normal changes when requested
  ansible.builtin.uri:
    url: "{{ itsm_api_base_url }}/api/v1/changes/{{ itsm_change_by_key[item.change_key] }}/approve"
    method: POST
    force_basic_auth: true
    url_username: "{{ itsm_api_user }}"
    url_password: "{{ itsm_api_password }}"
    validate_certs: "{{ itsm_validate_certs }}"
    body_format: json
    body: {}
    status_code: [200]
    timeout: "{{ itsm_http_timeout }}"
    headers:
      Accept: application/json
      Content-Type: application/json
  loop: "{{ itsm_changes }}"
  when:
    - itsm_ansible_role_changes | bool
    - item.approve | default(false) | bool
    - item.change_key is defined
    - item.change_key in (itsm_change_by_key | default({}))
